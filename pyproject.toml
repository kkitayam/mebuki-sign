[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mebuki-sign"
version = "0.1.0"
description = "Firmware signing tool for mebuki secure boot library"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "Koji KITAYAMA" }
]
keywords = ["secure-boot", "firmware", "signing", "cryptography", "mcu"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security :: Cryptography",
    "Topic :: Software Development :: Embedded Systems",
]

dependencies = [
    "cryptography>=42.0.0",
    "click>=8.1.0",
    "py-fn-dsa>=0.1.0",
    "ed25519-blake2b>=1.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
]

[project.scripts]
mebuki-sign = "mebuki_sign.cli:main"

[project.urls]
Homepage = "https://github.com/kkitayam/mebuki"
Documentation = "https://github.com/kkitayam/mebuki/tree/main/docs"
Repository = "https://github.com/kkitayam/mebuki"

[tool.hatch.build.targets.wheel]
packages = ["src/mebuki_sign"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--verbose",
    "--strict-markers",
    "--cov=mebuki_sign",
    "--cov-report=term-missing",
    "--cov-report=html",
]
