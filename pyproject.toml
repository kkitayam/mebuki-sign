[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mebuki-sign"
version = "0.1.0"
description = "Firmware signing tool for libmebuki secure boot library"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "mebuki contributors" }
]
keywords = ["secure-boot", "firmware", "signing", "cryptography", "mcu"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security :: Cryptography",
    "Topic :: Software Development :: Embedded Systems",
]

dependencies = [
    "cryptography>=42.0.0",
    "click>=8.1.0",
    "ed25519-blake2b>=1.3",
]

[project.optional-dependencies]
pqc = [
    "liboqs-python>=0.10.0",
]
fndsa = [
    "py-fn-dsa>=0.1.0",
]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "mypy>=1.7.0",
    "ruff>=0.1.0",
]

[project.scripts]
mebuki-sign = "mebuki_sign.cli:main"

[project.urls]
Homepage = "https://github.com/kkitayam/mebuki"
Documentation = "https://github.com/kkitayam/mebuki/tree/main/docs"
Repository = "https://github.com/kkitayam/mebuki"

[tool.hatch.build.targets.wheel]
packages = ["src/mebuki_sign"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--verbose",
    "--strict-markers",
    "--cov=mebuki_sign",
    "--cov-report=term-missing",
    "--cov-report=html",
]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_generics = true

[[tool.mypy.overrides]]
module = ["oqs", "py_fn_dsa", "ed25519_blake2b"]
ignore_missing_imports = true

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501", # line too long (handled by formatter)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"] # allow assert in tests

[tool.uv.sources]
py-fn-dsa = { path = "../py-fn-dsa", editable = true }
